<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="MoggyDay Trainer Hub">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f3d3a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#line)"/>

  <text x="72" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#f8fafc">MoggyDay</text>
  <text x="72" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#22d3ee">TRAINER HUB</text>
  <text x="72" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">game trainers · clients · tools</text>

  <rect x="980" y="88" width="220" height="144" rx="28" fill="#0ea5e9" fill-opacity="0.10" stroke="#22d3ee" stroke-width="2.5"/>
  <rect x="1168" y="96" width="24" height="24" rx="6" fill="#84cc16"/>
  <text x="1090" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#22d3ee">MD</text>
</svg>
